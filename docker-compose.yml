services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: bus-communal-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    depends_on:
      - mariadb
      - mailpit

  nginx:
    image: nginx:1.27-alpine
    container_name: bus-communal-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: bus-communal-queue
    restart: unless-stopped
    working_dir: /var/www/html
    # Le worker tourne en www-data, comme php-fpm : les fichiers qu'il crée (exports du planning, feuilles de route…)
    # restent lisibles par l'API. En root, Laravel crée les dossiers privés en 0700 et le téléchargement répond 404.
    # L'entrypoint reste en root pour remettre storage/ à www-data au démarrage.
    # setpriv (et non runuser) remplace le processus : le worker reçoit SIGTERM directement et finit son job en cours
    # (runuser tue l'enfant 2 s après SIGTERM). stop_grace_period couvre le timeout du plus long job (180 s).
    # --max-time=3600 : le worker s'arrête proprement après une heure (après son job en cours) et restart le relance,
    # ce qui évite qu'un processus PHP tourne des semaines (mémoire, connexions perdues).
    command: setpriv --reuid=www-data --regid=www-data --init-groups -- php artisan queue:work --queue=${QUEUE_WORKER_QUEUES} --sleep=1 --tries=3 --timeout=120 --max-time=3600
    stop_grace_period: 190s
    volumes:
      - .:/var/www/html
    depends_on:
      - app
      - mariadb
      - mailpit

  mariadb:
    image: mariadb:11.4
    container_name: bus-communal-mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: bus_communal
      MARIADB_USER: bus_user
      MARIADB_PASSWORD: bus_password
    ports:
      - "3307:3306"
    volumes:
      - bus_communal_mariadb_data:/var/lib/mysql
      - ./docker/mariadb/init:/docker-entrypoint-initdb.d

  adminer:
    image: adminer:latest
    container_name: bus-communal-adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    depends_on:
      - mariadb

  # Tâches planifiées de routes/console.php (feuilles de route, rappels, clôture des réservations expirées…),
  # comme le cron d'un serveur de production. En www-data, comme php-fpm et le worker : les fichiers créés
  # restent lisibles par l'API ; l'entrypoint (root) remet storage/ à www-data au démarrage.
  # setpriv plutôt que runuser : voir le service queue (arrêt propre sur SIGTERM).
  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: bus-communal-scheduler
    restart: unless-stopped
    working_dir: /var/www/html
    command: setpriv --reuid=www-data --regid=www-data --init-groups -- php artisan schedule:work
    volumes:
      - .:/var/www/html
    depends_on:
      - app
      - mariadb
      - mailpit

  # Serveur d'emails de dev : reçoit tout ce que l'application envoie (vérification d'email, mot de passe oublié,
  # notifications), sans quota ni envoi réel. Interface web : http://localhost:8025 ; SMTP : mailpit:1025 depuis
  # les conteneurs (MAIL_HOST=mailpit, MAIL_PORT=1025). Accepte n'importe quel identifiant SMTP ; garde les
  # MP_MAX_MESSAGES derniers emails (les plus anciens sont supprimés).
  mailpit:
    image: axllent/mailpit:v1.31.4
    container_name: bus-communal-mailpit
    restart: unless-stopped
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
      MP_MAX_MESSAGES: 2000
    ports:
      - "8025:8025"
      - "1025:1025"

volumes:
  bus_communal_mariadb_data:
