; Worker de file, installation sans Docker. À copier dans /etc/supervisor/conf.d/bus-communal-worker.conf
; (voir deploy/README.md). Mêmes réglages que le service « queue » de la stack Docker :
;   --queue : files par priorité décroissante (QUEUE_WORKER_QUEUES du .env, à reporter ici si elle change)
;   --max-time=3600 : arrêt propre chaque heure, Supervisor le relance (autorestart)
;   stopwaitsecs=190 : laisse finir le plus long job (180 s) à l'arrêt ou au redémarrage
[program:bus-communal-worker]
command=/usr/bin/php /opt/bus-communal/artisan queue:work --queue=critical,default,low --sleep=1 --tries=3 --timeout=120 --max-time=3600
directory=/opt/bus-communal
; Même utilisateur que php-fpm : les fichiers créés (exports, feuilles de route) restent lisibles par l'API.
user=www-data
numprocs=1
autostart=true
autorestart=true
startsecs=1
stopsignal=TERM
stopwaitsecs=190
stopasgroup=true
killasgroup=true
redirect_stderr=true
; Hors de storage/ : Supervisor écrit ce fichier en root.
stdout_logfile=/var/log/supervisor/bus-communal-worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
