# Site Nginx de l'API, installation sans Docker. À copier dans /etc/nginx/sites-available/bus-communal puis activer
# (voir deploy/README.md). Remplacer api.exemple.be ; le HTTPS est ajouté ensuite par certbot --nginx.
server {
    listen 80;
    listen [::]:80;
    server_name api.exemple.be;

    root /opt/bus-communal/public;
    index index.php;

    server_tokens off;
    client_max_body_size 20M;

    gzip on;
    gzip_types application/json text/plain text/css application/javascript;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        # Les exports et feuilles de route lourds sont faits par le worker ; 60 s suffisent pour l'API.
        fastcgi_read_timeout 60s;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
