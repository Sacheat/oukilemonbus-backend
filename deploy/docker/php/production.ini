; Réglages PHP de production (php-fpm, worker de file et scheduler).

expose_php = Off
display_errors = Off
log_errors = On

memory_limit = 256M
max_execution_time = 60
; Justificatifs : 5 Mo par défaut (config/uploads.php) ; nginx accepte 20 Mo.
upload_max_filesize = 20M
post_max_size = 25M

; Le code est dans l'image et ne change pas pendant la vie du conteneur : OPcache ne vérifie plus les fichiers.
; Un déploiement reconstruit l'image et recrée les conteneurs, ce qui vide le cache.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0

realpath_cache_size = 4096K
realpath_cache_ttl = 600
