# Nginx de production : sert public/ et passe le PHP au conteneur app.
# Il n'écoute que derrière un proxy HTTPS (Caddy du profil « https » ou nginx de la VM) : voir deploy/README.md.
server {
    listen 80;
    server_name _;

    root /var/www/html/public;
    index index.php;

    server_tokens off;
    client_max_body_size 20M;

    gzip on;
    gzip_types application/json text/plain text/css application/javascript;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        # Les exports et feuilles de route lourds sont faits par le worker ; 60 s suffisent pour l'API.
        fastcgi_read_timeout 60s;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
