; Réglages PHP de production, communs aux deux options :
;   Docker : copié dans l'image (deploy/docker/Dockerfile.prod)
;   sans Docker : copié dans /etc/php/8.4/fpm/conf.d/ (deploy/README.md)

expose_php = Off
display_errors = Off
log_errors = On

memory_limit = 256M
max_execution_time = 60
; Justificatifs : 5 Mo par défaut (config/uploads.php) ; nginx accepte 20 Mo.
upload_max_filesize = 20M
post_max_size = 25M

; Le code ne change qu'au déploiement : OPcache ne vérifie plus les fichiers à chaque requête. Le cache est vidé
; par le déploiement (Docker : conteneurs recréés ; sans Docker : deploy/native/deploy.sh recharge php-fpm).
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0

realpath_cache_size = 4096K
realpath_cache_ttl = 600
